# pnpm settings for the root app. Each setting's reasoning sits directly above it
# so it survives automated rewrites of this file (e.g. Renovate bumping overrides).

# docs/ is deliberately NOT a workspace member: it is a standalone Fumadocs site
# with its own package.json, lockfile and Vercel project, with no code coupling to
# the root app. Keeping it separate means root and docs dependency updates land
# and deploy independently. Drive docs from root via `cd docs && ...` scripts
# instead of `pnpm --filter`.
packages: []

# Only resolve versions published at least 3 days ago (pnpm's default is 1 day).
# Matches renovate.json's minimumReleaseAge so lockfile regeneration - including
# Renovate's - never pulls a brand-new transitive release. Frozen installs (CI)
# also reject lockfile entries that break this. For an urgent security patch,
# add the package to `minimumReleaseAgeExclude` temporarily.
minimumReleaseAge: 4320

# Force vite to a patched version across all workspace packages.
# CVE-2026-53571: server.fs.deny bypass, fixed in 8.0.16.
# Remove once vitest/fumadocs-mdx update their peer deps to pull >= 8.0.16.
overrides:
  vite: '8.3.2'

allowBuilds:
  '@scarf/scarf': false
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
