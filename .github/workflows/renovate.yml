# Self-hosted Renovate.
name: Renovate

on:
  schedule:
    # 1st of the month, 03:23 UTC. renovate.json's own `schedule` gates when
    # PRs actually open; this cron only controls how often Renovate wakes up
    # to check. GitHub delays scheduled runs by hours under load (worst on the
    # hour and on the 1st), so the minute is off-peak and renovate.json's
    # window spans the whole day to absorb the lag.
    - cron: '23 3 1 * *'
  # Manual "run now" button in the Actions tab.
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore renovate.json schedule and open PRs immediately (for testing)'
        type: boolean
        default: false

# GITHUB_TOKEN is too restrictive for Renovate; we use an App token instead.
# These permissions apply to the workflow itself, not the App token.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      # Projects created from this template start without the Renovate app
      # secrets. Skip (successfully, with a notice) until they're added, rather
      # than failing every month.
      - name: Check Renovate is set up
        id: setup
        env:
          RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
        run: |
          if [ -z "$RENOVATE_APP_ID" ]; then
            echo "::notice title=Renovate is not set up::Add the RENOVATE_APP_ID, RENOVATE_APP_PRIVATE_KEY and RENOVATE_GITHUB_COM_TOKEN secrets - see https://docs.eep-next-template.dev/docs/deployment/ci-cd#self-hosting-setup"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Mint a short-lived (1h) installation token from the Renovate GitHub App.
      # Renovate uses this to open and update PRs under the App's bot identity.
      - name: Get Renovate app token
        if: steps.setup.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        if: steps.setup.outputs.ready == 'true'
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Scope Renovate to this repo only - never autodiscover the whole org.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Read-only github.com token for changelog/release-note fetching.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          # When the "force" input is ticked, null the schedule so PRs open now
          # regardless of renovate.json's window. Empty string otherwise (no-op).
          RENOVATE_FORCE: ${{ inputs.force && '{"schedule":null}' || '' }}
          LOG_LEVEL: debug
