# Local Postgres for development.
#
# Brings up a single Postgres instance matching the DATABASE_URL in
# .env.local. Production uses a hosted provider (e.g. Neon) - only the
# DATABASE_URL changes, the app's node-postgres driver is identical.
#
# Use the pnpm scripts - they pass --env-file .env.local so POSTGRES_PORT is
# picked up (plain `docker compose` only reads .env):
#
#   pnpm db:up          # start
#   pnpm db:down        # stop (keeps data volume)
#   pnpm db:down -v     # stop and wipe data
#
# No fixed container_name: Compose names containers and volumes after the
# project folder (e.g. my-app-postgres-1, my-app_postgres_data), so several
# projects created from this template can run side by side without clashing.
#
# Port 5432 already taken by another project? Set a free port in .env.local -
# e.g. POSTGRES_PORT=5433 - and run `pnpm db:up`. DATABASE_URL reads
# ${POSTGRES_PORT}, so it follows automatically.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
