packages:
  - '.'

# Only resolve versions published at least 3 days ago (pnpm's default is 1 day).
# Matches renovate.json's minimumReleaseAge so lockfile regeneration - including
# Renovate's - never pulls a brand-new transitive release.
minimumReleaseAge: 4320

# Force js-yaml to a patched version. It is pulled transitively by fumadocs-*.
# CVE-2026-59869 / CVE-2026-59870 (GHSA-5p4m-2wfm-xmqj): DoS via crafted YAML
# and quadratic CPU in !!omap resolution, fixed in 4.3.1. Remove once fumadocs
# updates its peer deps to pull >= 4.3.1.
overrides:
  js-yaml@<4.3.1: '^4.3.2'
  # Force undici to a patched version. It is pulled transitively by @ai-sdk/provider-utils.
  # CVE-2026-12151 / CVE-2026-1526 / CVE-2026-2229: WebSocket DoS via unbounded memory
  # growth, fixed in 6.27.0. Remove once @ai-sdk/provider-utils updates to pull >= 6.27.0.
  undici@<6.27.0: '^6.27.0'

allowBuilds:
  esbuild: true
  sharp: true
